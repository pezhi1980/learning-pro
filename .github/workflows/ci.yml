name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Unit, Performance & Security Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Regression Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m unittest backend/tests/test_performance.py backend/tests/test_release_engineering.py backend/tests/test_operations.py backend/tests/test_learner_utilities.py backend/tests/test_engagement_systems.py backend/tests/test_analytics_and_quality.py backend/tests/test_security_and_privacy.py backend/tests/test_ai_operations.py backend/tests/test_admin_and_audit.py backend/tests/test_content_lifecycle.py backend/tests/test_advanced_learning_intelligence.py backend/tests/test_writing_system.py backend/tests/test_speaking_system.py backend/tests/test_audio_system.py backend/tests/test_assessment_system.py backend/tests/test_session_and_progress.py backend/tests/test_course_architecture.py backend/tests/test_curriculum.py backend/tests/test_learning_decision.py backend/tests/test_learner.py backend/tests/test_evaluation.py backend/tests/test_schemas.py backend/tests/test_validators.py backend/tests/test_assignment.py

  flutter-tests:
    name: Flutter Client Unit & Widget Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.x'

      - name: Create .env file for Flutter
        run: |
          cd app
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> .env

      - name: Install Flutter Dependencies
        run: |
          cd app
          flutter pub get

      - name: Run Flutter Tests
        run: |
          cd app
          flutter test
