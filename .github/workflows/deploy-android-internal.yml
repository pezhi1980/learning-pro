name: Deploy Android to Play Internal Testing

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-android-internal.yml'

jobs:
  deploy:
    name: Build and Upload AAB to Internal Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat <<EOF > app/android/app/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release AAB
        working-directory: app
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Upload to Play Store Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.pezhi1980.learning_lang_pro
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Clean up secrets from filesystem
        if: always()
        run: |
          rm -f app/android/app/upload-keystore.jks
          rm -f app/android/app/key.properties
