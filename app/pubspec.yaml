name: learning_lang_pro
description: "Learning Lang Pro — Multilingual Language Learning App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── Supabase ──────────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ────────────────────────────────────────────
  go_router: ^15.1.2

  # ── UI & Design ───────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_card_swiper: ^7.0.1
  flip_card: ^0.7.0
  percent_indicator: ^4.2.3

  # ── Utilities ─────────────────────────────────────────────
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  intl: ^0.20.2
  logger: ^2.5.0
  connectivity_plus: ^6.1.3

  # ── Audio / TTS ───────────────────────────────────────────
  audioplayers: ^6.4.0
  flutter_tts: ^4.2.3

  # ── Icons ─────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  phosphor_flutter: ^2.1.0

  # ── HTTP ──────────────────────────────────────────────────
  http: ^1.2.2
  dio: ^5.8.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/audio/
    - .env
  # Fonts are loaded via google_fonts package (no local files needed)
  # Custom Vazirmatn font will be added in next phase
